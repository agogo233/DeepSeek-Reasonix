name: Build CLI (linux amd64 + windows amd64)

# 手动云编译入口：GitHub Actions 页面点 "Run workflow" 即可。
# 在 ubuntu-latest 上交叉编译两个平台的 CLI 单二进制并打包上传为 artifact。
# 仅 workflow_dispatch 触发，不碰官方 release 通道。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (empty = current default branch)"
        required: false
        default: ""
        type: string
      version:
        description: "Version baked into the binary (empty = git describe)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: cross-compile CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif git describe --tags --always >/dev/null 2>&1; then
            echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build linux/amd64
        run: |
          mkdir -p dist/packaged
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o dist/reasonix-linux-amd64 ./cmd/reasonix

      - name: Build windows/amd64
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o dist/reasonix-windows-amd64.exe ./cmd/reasonix

      - name: Package archives and checksums
        run: |
          tar -czf dist/packaged/reasonix-linux-amd64.tar.gz -C dist reasonix-linux-amd64
          python3 -c "
          import zipfile
          with zipfile.ZipFile('dist/packaged/reasonix-windows-amd64.zip', 'w') as z:
              z.write('dist/reasonix-windows-amd64.exe', 'reasonix-windows-amd64.exe')
          "
          (
            cd dist/packaged
            sha256sum reasonix-linux-amd64.tar.gz reasonix-windows-amd64.zip > SHA256SUMS
          )
          ls -l dist/packaged

      - name: Upload artifacts
        uses: actions/upload-artifact@v8
        with:
          name: reasonix-cli-linux-amd64-windows-amd64
          path: dist/packaged/*
          if-no-files-found: error